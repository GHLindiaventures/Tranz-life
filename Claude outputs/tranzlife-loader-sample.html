.dna{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:dnafade var(--T) infinite}
.dna path{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--T) infinite}
.dna .g{stroke:url(#gold)} .dna .v{stroke:url(#green);animation-delay:.12s}
.dna line{stroke:#e3c25a;stroke-width:3;stroke-linecap:round;opacity:0;animation:rung var(--T) infinite;animation-delay:calc(var(--d)*1.1s)}
.seed{position:absolute;left:50%;top:61%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#e3a21a;box-shadow:0 0 0 0 rgba(227,162,26,.6);animation:seed var(--T) infinite}
