<p class="cap">Sketch loader sample · DNA → roots → tree → name → real logo</p>
<script>
// every line of the logo is drawn like a pen sketch, in order (DNA, roots, trunk, leaves, then the name),
// then the real colour logo fills in over the sketch and the sketch fades away
const T=7600, ease='cubic-bezier(.45,.05,.25,1)';
function run(){
  document.getAnimations().forEach(a=>a.cancel());
  document.querySelectorAll('svg path').forEach(p=>p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:+p.dataset.d,delay:+p.dataset.t,easing:ease,fill:'both'}));
  const fillIn=(el,t)=>el.animate([{opacity:0,clipPath:'inset(100% 0 0 0)',filter:'saturate(.2)'},{opacity:1,clipPath:'inset(0 0 0 0)',filter:'saturate(1)'}],{duration:1100,delay:t,easing:ease,fill:'both'});
  const fillW=(el,t)=>el.animate([{opacity:0,clipPath:'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0 0 0)'}],{duration:800,delay:t,easing:ease,fill:'both'});
  const fade=(el,t,d)=>el.animate([{opacity:1},{opacity:0}],{duration:d,delay:t,fill:'both'});
  fillIn(re,3500); fade(se,4100,700);
  fillW(rw,5450); fade(sw,6000,500);
  tg.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:600,delay:6100,fill:'both'});
  br.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:6600,fill:'both'});
  st.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'scale(.92) translateY(-16px)',filter:'blur(4px)'}],{duration:700,delay:7000,easing:ease,fill:'both'});
}
if (matchMedia('(prefers-reduced-motion:reduce)').matches){ re.style.opacity=rw.style.opacity=tg.style.opacity=1; se.style.display=sw.style.display='none'; }
else { run(); if (!window.__capture) setInterval(run, T+800); }
</script></body></html>
